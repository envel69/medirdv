name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # tous les jours à 5 h UTC : détecte aussi les dérives sans nouveau commit
  workflow_dispatch:
    inputs:
      declencheur:
        description: "Origine du lancement"
        type: choice
        options: [manuel, charge]
        default: manuel
      details_charge:
        description: "Mesures de charge (JSON, renseigné automatiquement par l'API quand la charge est trop haute)"
        required: false
        default: ""
      latence_simulee_ms:
        description: "Latence artificielle ajoutée à chaque requête de l'API (ex. 600) pour tester l'alerte de lenteur"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Base MongoDB jetable créée dans le runner : aucun secret, aucun accès à Atlas
  MONGODB_URI: mongodb://localhost:27017
  DB_NAME: doctolib_ci
  PORT: "3001"
  TZ: Europe/Paris
  CHARGE_SURVEILLANCE: "off"

jobs:
  # ------------------------------------------------------------------ Alerte de charge
  alerte-charge:
    name: Alerte charge élevée
    if: github.event_name == 'workflow_dispatch' && inputs.declencheur == 'charge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Ouvrir ou mettre à jour l'issue « charge »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DETAILS_CHARGE: ${{ inputs.details_charge }}
        run: bash scripts/charge-issue.sh

  # ------------------------------------------------------------------ CI : tests
  tests:
    name: Tests de l'API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Générer le jeu de données
        run: npm run seed
      - name: Démarrer l'API
        run: |
          nohup node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "localhost:$PORT/sante" > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Tests d'intégration
        run: npm test
      - name: Logs de l'API
        if: failure()
        run: cat api.log

  # ------------------------------------------------------------------ CI : tests de lenteur
  performance:
    name: Tests de lenteur (k6)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      LATENCE_SIMULEE_MS: ${{ inputs.latence_simulee_ms || '0' }}
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Générer le jeu de données
        run: npm run seed
      - name: Démarrer l'API
        run: |
          nohup node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "localhost:$PORT/sante" > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: grafana/setup-k6-action@v1

      - name: Test de charge k6
        id: k6
        env:
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: k6/rapport.html
          K6_NO_COLOR: "true"
        run: |
          set +e
          k6 run --quiet --summary-export k6/summary.json k6/load-test.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 99 = seuils de performance dépassés (lenteur) ; autre code non nul = erreur du script
          if [ "$code" -ne 0 ] && [ "$code" -ne 99 ]; then exit "$code"; fi

      - name: Rapport de performance
        if: always() && hashFiles('k6/summary.json') != ''
        run: node scripts/perf-report.mjs k6/summary.json perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Artefacts (rapport k6 HTML + résumé JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-k6
          path: |
            k6/rapport.html
            k6/summary.json
            api.log
          if-no-files-found: ignore

      # Les issues ne sont gérées que pour la branche principale (pas pour les pull requests)
      - name: Ouvrir ou mettre à jour l'issue de lenteur
        if: steps.k6.outputs.code == '99' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/perf-issue.sh ouvrir

      - name: Fermer l'issue de lenteur si les seuils sont respectés
        if: steps.k6.outputs.code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/perf-issue.sh fermer

      - name: Échouer si lenteur détectée
        if: steps.k6.outputs.code == '99'
        run: |
          echo "::error title=Lenteur détectée::$(paste -sd ', ' k6/seuils-depasses.txt)"
          exit 1

  # ------------------------------------------------------------------ CD : livraison
  livraison:
    name: Livraison (image Docker → ghcr.io)
    needs: [tests, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.nom }}:test
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée de l'image
        run: |
          docker run -d --name api --network host \
            -e MONGODB_URI=mongodb://localhost:27017 -e DB_NAME=doctolib_smoke -e CHARGE_SURVEILLANCE=off \
            ${{ steps.image.outputs.nom }}:test
          for i in $(seq 1 30); do curl -sf localhost:3001/sante > /dev/null && break; sleep 1; done
          curl -sf localhost:3001/sante | tee /dev/stderr | grep -q '"statut":"ok"' || { docker logs api; exit 1; }
          curl -sf localhost:3001/ | grep -q "MédiRDV" || { echo "page d'accueil absente"; exit 1; }

      - name: Publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.nom }}:latest
            ${{ steps.image.outputs.nom }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      - name: Résumé
        run: |
          {
            echo "## 🚀 Image publiée"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.image.outputs.nom }}:latest"
            echo "docker run -p 3001:3001 -e MONGODB_URI=... ${{ steps.image.outputs.nom }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ Baromètre W/L
  barometre:
    name: Baromètre W/L
    needs: [tests, performance, livraison]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publie le badge sur la branche « barometre »
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Calculer le baromètre
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTAT_COURANT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
        run: node scripts/barometre.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le badge (branche barometre)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/badge && cp barometre.json barometre-complet.json /tmp/badge/ && cd /tmp/badge
          git init -q -b barometre
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Baromètre W/L (exécution ${GITHUB_RUN_NUMBER})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" barometre
